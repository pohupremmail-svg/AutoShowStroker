name: Engine

# The C# rebuild in engine/: its tests. res/ is watched too - the callout and translation files are
# checked by the engine's tests.
on:
  pull_request:
    branches: [main]
    paths:
      - "engine/**"
      - "res/**"
      - ".github/workflows/engine.yml"
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "res/**"
      - ".github/workflows/engine.yml"

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: engine/global.json

      - run: dotnet test engine/GoonerEngine.sln
