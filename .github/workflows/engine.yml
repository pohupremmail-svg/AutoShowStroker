name: Engine

# The C# rebuild in engine/. Two jobs: the port's own tests, and the parity run that holds it
# against the Python implementation. The parity job also watches src/ - a change to the Python
# side that the port does not follow has to turn this red, not drift by quietly.
on:
  pull_request:
    branches: [main]
    paths:
      - "engine/**"
      - "parity/**"
      - "src/**"
      - "res/**"
      - ".github/workflows/engine.yml"
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "parity/**"
      - "src/**"
      - "res/**"
      - ".github/workflows/engine.yml"

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: engine/global.json

      - run: dotnet test engine/GoonerEngine.sln

  parity:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: engine/global.json

      # Golden files are written fresh from the Python side on every run, never checked in.
      - run: python -m parity.generate

      - run: dotnet test engine/Gooner.Parity.Tests
