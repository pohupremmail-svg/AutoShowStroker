name: CI

# Every test of the app: its logic (Gooner.Core.Tests) and what the package is built from
# (Gooner.Build.Tests). Run on every change - the callout and translation files in res/, the
# session format in skills/ and the release workflow are all checked by them too.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: engine/global.json

      - run: dotnet test engine/GoonerEngine.sln
