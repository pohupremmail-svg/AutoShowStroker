# Watches the engine's NuGet packages, transitive ones included, for newly-disclosed
# vulnerabilities.
#
# Deliberately a separate workflow rather than a step in CI: the pins do not change on
# their own, but the advisory database does, so a finding here is almost never caused by
# the commit being tested. Gating every pull request on it would mean an advisory
# published overnight turns unrelated work red. This runs on its own schedule instead,
# and GitHub mails the owner when it fails.
#
# The exception is a pull request that actually touches the package references - that is the
# one moment the answer is about the change in front of you, so it runs there too.
name: Audit

on:
  schedule:
    # Mondays, 06:00 UTC. Weekly is the right cadence for a desktop app that ships its
    # runtime: a finding means cutting a release, not just merging a bump.
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "engine/**/*.csproj"
      - "engine/Directory.Build.props"
      - "engine/global.json"
      - ".github/workflows/audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The listing itself exits 0 whatever it finds, so the JSON is read: a project with anything
  # vulnerable is the only kind that lists packages at all.
  nuget-audit:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: engine/global.json

      - run: dotnet restore engine/GoonerEngine.sln

      - name: Audit NuGet packages
        run: |
          dotnet list engine/GoonerEngine.sln package --vulnerable --include-transitive --format json > vulnerable.json
          python3 - <<'PY'
          import json, sys
          listing = json.load(open("vulnerable.json", encoding="utf-8-sig"))
          found = [project["path"] for project in listing["projects"] if project.get("frameworks")]
          for path in found:
              print(f"Vulnerable packages in {path}")
          print("No vulnerable packages." if not found else "")
          sys.exit(1 if found else 0)
          PY
