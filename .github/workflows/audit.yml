# Watches the pinned dependencies for newly-disclosed vulnerabilities.
#
# Deliberately a separate workflow rather than a step in CI: the pins do not change on
# their own, but the advisory database does, so a finding here is almost never caused by
# the commit being tested. Gating every pull request on it would mean an advisory
# published overnight turns unrelated work red. This runs on its own schedule instead,
# and GitHub mails the owner when it fails.
#
# The exception is a pull request that actually touches the requirements - that is the one
# moment the answer is about the change in front of you, so it runs there too.
name: Audit

on:
  schedule:
    # Mondays, 06:00 UTC. Weekly is the right cadence for a desktop app that ships a
    # bundled interpreter: a finding means cutting a release, not just merging a bump.
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install pip-audit

      # requirements-dev.txt pulls in requirements.txt, so this covers both, and without
      # --no-deps it resolves the transitive packages too - which is where a vulnerability
      # is most likely to sit, since those are the ones nobody pinned on purpose.
      - name: Audit pinned dependencies
        run: pip-audit --strict --requirement requirements-dev.txt
